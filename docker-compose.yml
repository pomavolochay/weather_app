services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      WEATHER_APP_WEATHER_API_KEY: ${WEATHER_APP_WEATHER_API_KEY:-demo}
      WEATHER_APP_WEATHER_API_BASE_URL: ${WEATHER_APP_WEATHER_API_BASE_URL:-https://api.weatherapi.com/v1}
      WEATHER_APP_REQUEST_TIMEOUT_SECONDS: ${WEATHER_APP_REQUEST_TIMEOUT_SECONDS:-10}
      WEATHER_APP_CORS_ALLOW_ORIGINS: ${WEATHER_APP_CORS_ALLOW_ORIGINS:-http://localhost:3000}
      WEATHER_APP_APP_ENV: production
    networks:
      - weather-net
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - weather-net
  blackbox:
    image: prom/blackbox-exporter:latest
    command: ["--config.file=/config/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/config/blackbox.yml:ro
    networks:
      - weather-net
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - blackbox
    networks:
      - weather-net
  grafana:
    image: grafana/grafana:10.4.3
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - weather-net

networks:
  weather-net:
    driver: bridge
